version: '3.8'

services:
  sql-transpiler:
    build: .
    image: sql-transpiler:latest
    container_name: sql-transpiler-app
    restart: always
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=PublicBank@2026
      - ADMIN_PASSWORD=Tuanpv@2026
    volumes:
      - sql_data:/home/user/app/data

volumes:
  sql_data:
    driver: local
